server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name getssher.com;

    root /var/www/ssher-marketing/current;
    index index.html;

    ssl_certificate /etc/ssl/ssher-origin/getssher-origin.crt;
    ssl_certificate_key /etc/ssl/ssher-origin/getssher-origin.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' https://fonts.googleapis.com 'unsafe-inline'; font-src https://fonts.gstatic.com; img-src 'self' data:; media-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; frame-ancestors 'none'; form-action 'self'; upgrade-insecure-requests" always;

    location = /index.html {
        expires -1;
        try_files $uri =404;
    }

    location = /ssher-cloud-launch.mp4 {
        expires 1d;
        try_files $uri =404;
    }

    location ~* \.(?:css|js|jpg|jpeg|png|svg|ico|webmanifest)$ {
        expires 1h;
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }

    access_log /var/log/nginx/ssher-marketing-access.log;
    error_log /var/log/nginx/ssher-marketing-error.log;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.getssher.com;

    ssl_certificate /etc/ssl/ssher-origin/getssher-origin.crt;
    ssl_certificate_key /etc/ssl/ssher-origin/getssher-origin.key;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 308 https://getssher.com$request_uri;
}

server {
    listen 80;
    listen [::]:80;
    server_name getssher.com www.getssher.com;
    return 308 https://getssher.com$request_uri;
}
